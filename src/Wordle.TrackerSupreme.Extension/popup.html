<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Import Wordle history</title>
  </head>
  <body>
    <main>
      <h1>Import from NYT</h1>
      <p>Open this extension on the official Wordle page while signed in to The New York Times.</p>
      <label for="code">Tracker Supreme import code</label>
      <input id="code" maxlength="9" autocomplete="one-time-code" placeholder="ABCD-EFGH" />
      <button id="import" type="button">Import my history</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="privacy">Your NYT password and cookies stay in this browser and are never read or uploaded.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
